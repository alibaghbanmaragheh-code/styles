<style>
.websaz-contact {
  direction: rtl;
  font-family: inherit;
  padding: 60px 20px;
  background: #f8f9fc;
}

.websaz-contact * {
  box-sizing: border-box;
}

.contact-container {
  max-width: 1200px;
  margin: 0 auto;
}

.contact-header {
  text-align: center;
  margin-bottom: 45px;
}

.contact-header h1 {
  font-size: 36px;
  font-weight: 800;
  color: #222;
  margin-bottom: 15px;
}

.contact-header p {
  font-size: 16px;
  color: #777;
  line-height: 1.9;
}

.contact-content {
  display: grid;
  grid-template-columns: 1fr 1.5fr;
  gap: 30px;
  align-items: start;
}

.contact-info {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.contact-info-item {
  background: #fff;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 5px 25px rgba(0, 0, 0, 0.04);
  border: 1px solid #eee;
}

.contact-info-item h3 {
  font-size: 18px;
  font-weight: 700;
  color: #222;
  margin: 0 0 12px;
}

.contact-info-item p {
  font-size: 15px;
  color: #666;
  line-height: 1.9;
  margin: 0;
}

.contact-form {
  background: #fff;
  padding: 35px;
  border-radius: 18px;
  box-shadow: 0 5px 30px rgba(0, 0, 0, 0.05);
  border: 1px solid #eee;
}

.contact-form h2 {
  font-size: 24px;
  font-weight: 800;
  color: #222;
  margin: 0 0 30px;
}

.contact-form .form-group {
  margin-bottom: 22px;
}

.contact-form label {
  display: block;
  font-size: 15px;
  font-weight: 600;
  color: #333;
  margin-bottom: 10px;
}

.contact-form input,
.contact-form textarea {
  display: block;
  width: 100%;
  padding: 14px 16px;
  border: 1px solid #ddd;
  border-radius: 10px;
  background: #fafafa;
  color: #333;
  font-family: inherit;
  font-size: 15px;
  outline: none;
  transition: all 0.3s ease;
}

.contact-form input:focus,
.contact-form textarea:focus {
  border-color: #2563eb;
  background: #fff;
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
}

.contact-form textarea {
  resize: vertical;
  min-height: 150px;
}

.contact-form button {
  display: block;
  width: 100%;
  padding: 15px 20px;
  border: none;
  border-radius: 10px;
  background: #2563eb;
  color: #fff;
  font-family: inherit;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s ease;
}

.contact-form button:hover {
  background: #1d4ed8;
  transform: translateY(-2px);
}

@media (max-width: 768px) {
  .websaz-contact {
    padding: 40px 15px;
  }

  .contact-content {
    grid-template-columns: 1fr;
  }

  .contact-header h1 {
    font-size: 28px;
  }

  .contact-form {
    padding: 25px 20px;
  }
}
</style>

<section class="websaz-contact">
  <div class="contact-container">
    <div class="contact-header">
      <h1>تماس با ما</h1>
      <p>برای ارتباط با ما، فرم زیر را تکمیل کنید.</p>
    </div>

    <div class="contact-content">

      <div class="contact-info">
        <div class="contact-info-item">
          <h3>شماره تماس</h3>
          <p dir="ltr">+989144708836</p>
        </div>

        <div class="contact-info-item">
          <h3>ایمیل</h3>
          <p>info@example.com</p>
        </div>

        <div class="contact-info-item">
          <h3>آدرس</h3>
          <p>برای دریافت آدرس و اطلاعات بیشتر با ما تماس بگیرید.</p>
        </div>
      </div>

      <div class="contact-form">
        <h2>پیام خود را ارسال کنید</h2>

        <form action="#" method="post">
          <div class="form-group">
            <label for="contact-name">نام و نام خانوادگی</label>
            <input type="text" id="contact-name" name="name"
              placeholder="نام خود را وارد کنید" required>
          </div>

          <div class="form-group">
            <label for="contact-email">ایمیل</label>
            <input type="email" id="contact-email" name="email"
              placeholder="ایمیل خود را وارد کنید" required>
          </div>

          <div class="form-group">
            <label for="contact-message">پیام شما</label>
            <textarea id="contact-message" name="message" rows="6"
              placeholder="متن پیام خود را بنویسید" required></textarea>
          </div>

          <button type="submit">ارسال پیام</button>
        </form>
      </div>

    </div>
  </div>
</section>
